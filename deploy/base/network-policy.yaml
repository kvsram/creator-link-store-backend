apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: creator-store-api
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: creator-store-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: creator-store-web } }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports: [{ protocol: TCP, port: 5432 }]
      # Set namespaceSelector/ipBlock for the managed PostgreSQL network before enabling in a cloud cluster.
    - ports: [{ protocol: TCP, port: 443 }]
      # Required only for enabled payment/Instagram providers. Narrow this with an egress gateway or provider ranges where practical.
