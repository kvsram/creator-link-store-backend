apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-store-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: creator-store-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: creator-store-api
    spec:
      containers:
        - name: api
          image: ghcr.io/kvsram/creator-link-store-backend:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              valueFrom: { secretKeyRef: { name: creator-store-db, key: url } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: creator-store-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: creator-store-db, key: password } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
