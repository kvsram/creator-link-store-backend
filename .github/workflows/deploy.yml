name: Deploy backend
on:
  workflow_dispatch:
    inputs:
      stage: { type: choice, options: [dev, preprod, prod], required: true }
      region: { type: choice, options: [region-a, region-b, region-c], required: true }
      image_tag: { required: true, description: Immutable Git SHA, without sha- prefix }
      change_ticket: { required: true, description: Required for preprod and prod promotion }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    concurrency: { group: backend-${{ inputs.stage }}-${{ inputs.region }}, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config
      - run: kubectl apply -k deploy/overlays/${{ inputs.region }}
      - run: kubectl -n creator-store set image deployment/creator-store-api api=ghcr.io/${{ github.repository_owner }}/creator-link-store-backend:sha-${{ inputs.image_tag }}
      - run: kubectl -n creator-store rollout status deployment/creator-store-api --timeout=180s
