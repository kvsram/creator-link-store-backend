name: Build and publish backend image
# Every commit on main becomes one immutable image tagged with the full commit SHA.
# This is a build artifact, not a deployment: deploy-dev (E0.5) consumes it; staging and prod
# are promoted by SHA through protected GitHub Environments.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Verify (same gate as pull requests)
        run: mvn -B --no-transfer-progress verify
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/creator-link-store-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: target/app.jar
          retention-days: 30
