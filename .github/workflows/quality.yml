name: Backend quality gate
# Runs on every pull request. This is the required check for merging to main.
# mvn verify = compile + unit tests + integration tests against PostgreSQL 16 in Docker (Testcontainers)
#            + ArchUnit module-boundary rules.
on:
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build, unit tests, integration tests, architecture rules
        run: mvn -B --no-transfer-progress verify
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports
          retention-days: 7
      # Dependency and filesystem scan. Reporting only until gate G4 (production readiness),
      # when exit-code becomes '1' and the scan blocks the merge.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
