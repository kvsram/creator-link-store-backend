spring:
  application:
    name: creatorstore

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/creatorstore}
    username: ${DB_USER:creatorstore}
    password: ${DB_PASSWORD:creatorstore}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks that entities match it
    open-in-view: false         # no lazy loading in controllers; transactions end in the service layer

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# Actuator: only the health endpoint is exposed, and it says only UP or DOWN (no component details,
# no datasource URLs). /actuator/health/liveness and /readiness exist for the container platform.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.creatorstore: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}   # frontend URL used in SMS links

  jwt:
    secret: ${JWT_SECRET}                            # REQUIRED. At least 32 characters. Never commit it.
    issuer: creatorstore
    access-token-ttl: 15m
    admin-access-token-ttl: 8h
    refresh-token-ttl: 30d

  login:
    max-failed-attempts: 5
    lock-duration: 15m

  verification:
    link-ttl: 30m
    max-links-per-phone-per-hour: 3

  sms:
    provider: ${SMS_PROVIDER:log}                    # "log" prints the SMS to the console (dev). Add real providers later.

  admin:
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}               # set these once to create the first SUPER_ADMIN
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      full-name: ${ADMIN_BOOTSTRAP_NAME:Platform Admin}
