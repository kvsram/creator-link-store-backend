# Local development.
#   make up      -> PostgreSQL + Redis + the API (built from this checkout), seeded with a demo creator and admin
#   make db      -> only PostgreSQL + Redis, then run the API from your IDE or `make run`
#   make smoke   -> walks the auth flow against http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creatorstore
      POSTGRES_USER: creatorstore
      POSTGRES_PASSWORD: creatorstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorstore -d creatorstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Not used by the application yet. It is here so the local environment has the same shape as the
  # design (rate limits and the storefront cache arrive with E2.1); the Spring Redis dependency is added then.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache only: nothing to persist locally
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local          # enables the demo seed (DevSeed); never set in the cloud
      DB_URL: jdbc:postgresql://db:5432/creatorstore
      DB_USER: creatorstore
      DB_PASSWORD: creatorstore
      # Development-only values. Production secrets live in AWS Secrets Manager.
      JWT_SECRET: local-development-secret-at-least-32-characters-long
      ADMIN_BOOTSTRAP_EMAIL: admin@example.test
      ADMIN_BOOTSTRAP_PASSWORD: local-admin-password-123
      APP_BASE_URL: http://localhost:3000
      SMS_PROVIDER: log
    ports:
      - "8080:8080"

volumes:
  pgdata:
