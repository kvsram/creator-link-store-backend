services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creatorstore
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creatorstore"]
      interval: 5s
      timeout: 3s
      retries: 10
